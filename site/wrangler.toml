name = "dailydrop-site"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# 회원·북마크·방문 통계 (schema.sql). 비밀값은 wrangler secret put 으로: GOOGLE_CLIENT_ID, ADMIN_EMAILS, HIT_SALT, (선택) RESEND_API_KEY, MAIL_FROM
[[d1_databases]]
binding = "UDB"
database_name = "dailydrop-users"
database_id = "f3291f00-21f6-4f8a-b1bc-0e25b6ab1767"
