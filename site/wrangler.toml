name = "dailydrop-site"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# 사용자 지정 도메인 (대표: dailydropnewspaper.com, 기존 dailydrop.kr 도 유지)
routes = [
  { pattern = "dailydropnewspaper.com", custom_domain = true },
  { pattern = "www.dailydropnewspaper.com", custom_domain = true },
  { pattern = "dailydrop.kr", custom_domain = true },
  { pattern = "www.dailydrop.kr", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# 회원·북마크·방문 통계 (schema.sql). 비밀값은 wrangler secret put 으로: GOOGLE_CLIENT_ID, ADMIN_EMAILS, HIT_SALT, (선택) RESEND_API_KEY — MAIL_FROM 은 아래 [vars]
[[d1_databases]]
binding = "UDB"
database_name = "dailydrop-users"
database_id = "f3291f00-21f6-4f8a-b1bc-0e25b6ab1767"

# 인증 메일: Cloudflare Email Service(EMAIL 바인딩, no-reply 주소로만 발송 가능).
# 대시보드 Email Service > Email Sending 에 도메인을 등록한 뒤 MAIL_LIVE = "1" 로 켠다. (RESEND_API_KEY 비밀값이 있으면 그쪽으로도 보낼 수 있음)
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@dailydropnewspaper.com"]

[vars]
MAIL_FROM = "DailyDrop <no-reply@dailydropnewspaper.com>"
MAIL_LIVE = "1"
