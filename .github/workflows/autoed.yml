name: autoed-morning

# 데일리드롭 자동 조간 — Claude Code 세션 없이 돈다(ops/autoed/run.py).
# 깨우는 쪽: 피드 Worker 크론(매시 04분, GH_DISPATCH_TOKEN으로 이 워크플로를 호출). GitHub schedule은 main 브랜치 파일만 돌려서 여기서는 못 쓴다.
# 현지 05:30–11:59 (Claude 세션이 먼저 올리면 건너뜀 = 폴백) 이고 그 날짜 판이 없는 나라만 만든다. publish_at = 현지 06:00 → 사이트 Worker가 그 시각에 공개.
# 필요: Secrets ANTHROPIC_API_KEY. 선택: Variables DD_MODEL(기본 claude-sonnet-5-5), DD_EFFORT(low|medium|high, 기본 medium), DD_MAX, DD_PAUSE=1(일시 정지).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "나라 코드만(예: KR,JP). 비우면 시간이 된 나라 전부"
        required: false
        default: ""
      dates:
        description: "소급할 날짜(예: 2026-10-13,2026-10-14). 비우면 정시 조간"
        required: false
        default: ""
      max:
        description: "이번 실행 최대 판 수"
        required: false
        default: "14"
  push:
    # 워크플로 등록·점검용(판은 만들지 않음: --dry)
    branches: [paycheck-page]
    paths: [".github/workflows/autoed.yml", "ops/autoed/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: autoed
  cancel-in-progress: false

jobs:
  write:
    if: ${{ vars.DD_PAUSE != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paycheck-page
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Write due editions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DD_MODEL: ${{ vars.DD_MODEL }}
          DD_EFFORT: ${{ vars.DD_EFFORT }}
          DD_MAX: ${{ inputs.max || vars.DD_MAX || '14' }}
          DD_ONLY: ${{ inputs.only }}
          DD_DATES: ${{ inputs.dates }}
          DD_COMMIT: "1"
        run: |
          git config user.name "dailydrop-autoed"
          git config user.email "dailydrop-autoed@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then python ops/autoed/run.py --dry; exit 0; fi
          python ops/autoed/run.py
      - name: Commit log and push
        id: push
        if: always() && github.event_name != 'push'
        run: |
          git add site/editions site/editions.json site/markets.json site/pool.json ops/autoed/log || true
          git diff --cached --quiet || git commit -m "autoed: log $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do git pull --rebase origin paycheck-page && git push origin HEAD:paycheck-page && break; sleep $((i*5)); done
      - name: Deploy (push by GITHUB_TOKEN does not trigger site-deploy by itself)
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-deploy.yml --ref paycheck-page
