name: site-deploy

on:
  push:
    branches: [paycheck-page]
    paths:
      - "site/**"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Furigana for Japanese pages (newspaper style — only words with non-joyo kanji; skipped on failure)
        working-directory: site
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/furi kuromoji@0.1.2 joyo-kanji@0.2.1 >/dev/null 2>&1 \
            && NODE_PATH=/tmp/furi/node_modules node furigana.js || echo "furigana skipped (kept committed furigana.json)"
      - name: Build static site
        working-directory: site
        env:
          # Google 로그인 클라이언트 ID(공개값, 저장소 Variables). 비어 있으면 페이지가 Worker의 GOOGLE_CLIENT_ID(/api/auth/config)를 읽는다.
          DD_GOOGLE_CLIENT_ID: ${{ vars.DD_GOOGLE_CLIENT_ID }}
        run: node build.js editions.json
      - name: Prepare scheduled editions (publish_at, served by the Worker at local 06:00)
        working-directory: site
        run: node schedule.js
      - name: Deploy to Cloudflare Workers (static assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 없음"; exit 0; fi
          npx --yes wrangler@4 deploy
      - name: Tell search engines about published editions (IndexNow — Bing, Naver, Yandex, Seznam; non-fatal)
        run: |
          BODY=$(node -e "const S='https://dailydropnewspaper.com',K='7f0249be94d00919564c3e4df873f106',C=require('./site/countries.json');const e=require('./site/editions.json').filter(x=>!x.publish_at||Date.parse(x.publish_at)<=Date.now());const by={};for(const x of e){const r=x.region||'KR';if(!by[r]||by[r].date<x.date)by[r]=x}const pre=r=>{const c=C.find(z=>z.code===r);return c?c.prefix:r.toLowerCase()+'/'};const u=[S+'/'];for(const [r,x] of Object.entries(by)){u.push(S+'/'+pre(r),S+'/'+pre(r)+x.date+'/');for(const l of Object.keys(x.translations||{}))u.push(S+'/'+pre(r)+x.date+'/'+l+'/')}console.log(JSON.stringify({host:'dailydropnewspaper.com',key:K,keyLocation:S+'/'+K+'.txt',urlList:[...new Set(u)].slice(0,500)}))")
          curl -sS -m 30 -o /dev/null -w "indexnow %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' --data "$BODY" || echo "indexnow failed (non-fatal)"
      - name: Notify app users of a new edition (once per edition)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          # feed-deploy와 같은 식으로 INGEST_KEY를 만들어 /push/send 호출. 같은 호(edition)는 Worker가 한 번만 보냄.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          KEY=$(printf 'dailydrop-ingest:%s:%s' "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-48)
          LATEST=$(node -e "const e=require('./editions.json').filter(x=>(!x.region||x.region==='KR')&&(!x.publish_at||Date.parse(x.publish_at)<=Date.now()));e.sort((a,b)=>a.date.localeCompare(b.date));const l=e[e.length-1];console.log(JSON.stringify({edition:l.date,title:'데일리드롭 제'+l.no+'호 '+(l.date>='2026-10-09'?'아침판':'현지시각 18:00판'),body:(l.blurb||'').slice(0,120),url:'https://dailydropnewspaper.com/'+l.date+'/'}))")
          sleep 15
          curl -sS -m 60 -X POST https://dailydrop-feed.trustlj.workers.dev/push/send -H "authorization: Bearer $KEY" -H 'content-type: application/json' -d "$LATEST" || echo "push notify failed (non-fatal)"
