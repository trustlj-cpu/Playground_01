name: site-deploy

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static site
        working-directory: site
        run: node build.js editions.json
      - name: Deploy to Cloudflare Workers (static assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 없음"; exit 0; fi
          npx --yes wrangler@4 deploy
      - name: Notify app users of a new edition (once per edition)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          # feed-deploy와 같은 식으로 INGEST_KEY를 만들어 /push/send 호출. 같은 호(edition)는 Worker가 한 번만 보냄.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          KEY=$(printf 'dailydrop-ingest:%s:%s' "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-48)
          LATEST=$(node -e "const e=require('./editions.json');e.sort((a,b)=>a.date.localeCompare(b.date));const l=e[e.length-1];console.log(JSON.stringify({edition:l.date,title:'데일리드롭 제'+l.no+'호 저녁판',body:(l.blurb||'').slice(0,120),url:'https://dailydrop.kr/'+l.date+'/'}))")
          sleep 15
          curl -sS -m 60 -X POST https://dailydrop-feed.trustlj.workers.dev/push/send -H "authorization: Bearer $KEY" -H 'content-type: application/json' -d "$LATEST" || echo "push notify failed (non-fatal)"
