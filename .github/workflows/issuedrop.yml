name: issuedrop-collect

on:
  schedule:
    - cron: "0 21,3,9 * * *"   # KST 06:00 / 12:00 / 18:00
  workflow_dispatch:
  push:
    paths:
      - "issuedrop/**"
      - ".github/workflows/issuedrop.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python issuedrop/collect.py
      - name: Commit report
        run: |
          git config user.name "issuedrop-bot"
          git config user.email "issuedrop-bot@users.noreply.github.com"
          git add issuedrop/out   # latest.md는 issuedrop/out/ 안에 생성됨(이전 경로 오류로 run 2~7 커밋 단계 실패)
          git diff --cached --quiet || git commit -m "issuedrop: $(date -u +'%Y-%m-%d %H:%M UTC') report"
          git push
