name: app-update

# Native app (app-native/, Expo). Content never needs this workflow: the app reads the static JSON API
# that every site deploy regenerates. This ships *code* changes:
#  - push to app-mobile touching app-native/** → checks (typecheck, lint, tests), then an OTA update
#    (EAS Update) to the *preview* channel only
#  - manual run → optionally the same OTA update to the *production* channel, and/or store builds
#    (EAS Build, production profile, iOS + Android)
# runtimeVersion uses the "fingerprint" policy: an update only reaches installs whose native code matches,
# so a native dependency change can never be pushed over the air onto a binary that lacks it.
# Needs the repository secret EXPO_TOKEN (expo.dev → Access tokens). Without it the publish steps skip with a
# notice. The token is passed only to the steps that call EAS, not to npm install / tests.

on:
  push:
    branches: [app-mobile]
    paths:
      - "app-native/**"
      - ".github/workflows/app-update.yml"
  workflow_dispatch:
    inputs:
      production_update:
        description: "Publish an OTA update to the production channel"
        type: boolean
        default: false
      build:
        description: "Run EAS Build (iOS + Android, production profile)"
        type: boolean
        default: false

concurrency:
  group: app-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app-native
    steps:
      - name: Check EXPO_TOKEN
        id: tok
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=app-update::EXPO_TOKEN secret is not set — checks run, nothing is published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-native/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests
        run: npm test -- --ci
      - name: Publish OTA update (preview channel)
        if: steps.tok.outputs.ok == 'true' && github.event_name == 'push'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE: https://dailydropnewspaper.com/app/v1/
          EXPO_PUBLIC_ACCOUNT_SYNC: '1'
        run: npx eas-cli update --auto --channel preview --non-interactive
      - name: Publish OTA update (production channel, manual)
        if: steps.tok.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.production_update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE: https://dailydropnewspaper.com/app/v1/
          EXPO_PUBLIC_ACCOUNT_SYNC: '1'
        run: npx eas-cli update --auto --channel production --non-interactive

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-native
    steps:
      - name: Check EXPO_TOKEN
        id: tok
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=app-build skipped::EXPO_TOKEN secret is not set — EAS Build not started."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-native/package-lock.json
      - name: Install
        if: steps.tok.outputs.ok == 'true'
        run: npm ci
      - name: Start EAS Build (iOS + Android)
        if: steps.tok.outputs.ok == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform all --profile production --non-interactive --no-wait
