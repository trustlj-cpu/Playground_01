name: DailyDrop scheduled collection (Codex)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: scheduler
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: paycheck-page
          path: collector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Collect public feeds into the deployed news service
        id: ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FEED_URL: https://dailydrop-feed.trustlj.workers.dev
        run: python scheduler/codex-feed/run.py
      - name: Verify published collection
        env:
          EXPECTED_BATCH: ${{ steps.ingest.outputs.batch }}
        run: |
          python - <<'PYCODE'
          import json, urllib.request, datetime, os
          base = 'https://dailydrop-feed.trustlj.workers.dev'
          req = urllib.request.Request(base + '/batches.json', headers={'User-Agent': 'Mozilla/5.0 (compatible; DailyDropCollector/1.0)', 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              batches = json.load(r)
          if not batches or batches[0]['batch'] != os.environ['EXPECTED_BATCH']:
              raise SystemExit('This run did not publish the expected batch.')
          b = batches[0]
          age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(b['started_at'])).total_seconds()
          if age < -60 or age > 600:
              raise SystemExit('Published batch is stale or future-dated.')
          errors = json.loads(b.get('errors') or '[]')
          print('Published batch:', b['batch'], 'new:', b['n_new'], 'configured sources:', b['n_sources'], 'source errors:', len(errors))
          if len(errors) >= b['n_sources']:
              raise SystemExit('All configured sources failed.')
          PYCODE
