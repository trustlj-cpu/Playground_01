name = "dailydrop-feed"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "dailydrop-feed"
database_id = "0f239386-f7cf-42ed-838d-46eb896bea87"

[triggers]
crons = ["2 * * * *", "*/10 * * * *", "0 21,3,9 * * *", "* * * * *"]   # 매시 02분: 직전 1시간 취합본 / 10분: 수집 워크플로 호출(GH_DISPATCH_TOKEN 있을 때만)

# 속보 제목 번역(번역판) — Workers AI
[ai]
binding = "AI"
