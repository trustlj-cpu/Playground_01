manual_sources:
- name: Bloomberg Terminal
  access: '무료 없음. 합법 무료 경로: Bloomberg.com 월 무료 기사 소량, Bloomberg TV+ 라이브(유튜브TV·Tubi
    무료), Bloomberg Radio 라이브, 팟캐스트(Surveillance·Odd Lots) RSS, 무료 뉴스레터 ''Five Things
    to Start Your Day'' 이메일'
- name: FinancialJuice
  access: 무료 계정으로 실시간 스쿼크·헤드라인. RSS 없음 → 수동 모니터 또는 브라우저 자동화
- name: SAVE (오선, 파이브라인스)
  access: 앱 전용. 속보·개인화 알림·투자 캘린더 큐레이션. API/RSS 없음 → 수동 참고. 오선 유튜브 채널은 RSS 가능
- name: X(트위터)
  access: 'RSS 없음, Nitter·XCancel 사실상 종료(2026.9). 대안: 같은 인물의 Bluesky/Mastodon RSS,
    유료 rss.app, 또는 수동 리스트 확인'
- name: Reddit
  access: RSS 2026-11-13 종료 예정, 공개 API 2027-03 종료 예정 → 그 전까지만
- name: 블라인드
  access: RSS/API 없음, 로그인 필요 → 수동
